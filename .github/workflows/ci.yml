name: CI

# Required check `ci` on PRs and the merge queue (ruleset "trunk: PR + CI + merge queue").
# Hermetic: this repo plus npm install. @pack/* comes from GitHub Packages
# (see .npmrc). No PackServer checkout. pack-ci-read is not used here.
on:
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # land-smoke drives a real browser against the built site.
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npx jest --ci --bail=0
      - run: npm run build
