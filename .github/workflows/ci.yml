name: CI

# Required check `ci` on PRs and the merge queue (ruleset "trunk: PR + CI + merge queue").
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PackWebsite
    timeout-minutes: 30
    steps:
      # The build reads three PackServer packages as a sibling checkout (../PackServer/packages/*,
      # vite aliases + file: deps). PackServer is private and the enterprise disables deploy keys:
      # the pack-ci-read GitHub App (contents: read, installed on PackServer only) mints a 1 h token.
      - uses: actions/checkout@v4
        with:
          path: PackWebsite
      - id: packserver-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PACK_CI_READ_APP_ID }}
          private-key: ${{ secrets.PACK_CI_READ_APP_KEY }}
          owner: Pack-DevOrg
          repositories: PackServer
      - uses: actions/checkout@v4
        with:
          repository: Pack-DevOrg/PackServer
          token: ${{ steps.packserver-token.outputs.token }}
          persist-credentials: false
          path: PackServer
          sparse-checkout: |
            packages/schemas
            packages/locality-catalog
            packages/web-effects
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'PackWebsite/.nvmrc'
          cache: npm
          cache-dependency-path: PackWebsite/package-lock.json
      - run: npm ci --no-audit --no-fund
      # land-smoke drives a real browser against the built site.
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npx jest --ci --bail=0
      - run: node --test scripts/web-signin-smoke.test.mjs
      - run: npm run build
