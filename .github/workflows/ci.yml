name: CI

# Required check `ci` on PRs and the merge queue (ruleset "trunk: PR + CI + merge queue").
# Hermetic: this repo plus npm install. @pack/* comes from GitHub Packages
# (see .npmrc). No PackServer checkout. pack-ci-read mints a read token for the PackApp source checkout only.
on:
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Onboarding renders PackApp components: src comes from a sparse checkout of the private
      # PackApp repo (pack-ci-read GitHub App, contents: read, 1 h token). PackServer packages
      # are installed from GitHub Packages.
      - uses: actions/checkout@v4
      - id: packapp-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PACK_CI_READ_APP_ID }}
          private-key: ${{ secrets.PACK_CI_READ_APP_KEY }}
          owner: Pack-DevOrg
          repositories: |
            PackApp
      - uses: actions/checkout@v4
        with:
          repository: Pack-DevOrg/PackApp
          token: ${{ steps.packapp-token.outputs.token }}
          persist-credentials: false
          path: PackApp
          sparse-checkout: |
            src
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # land-smoke drives a real browser against the built site.
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npx jest --ci --bail=0
      - run: node --test scripts/web-signin-smoke.test.mjs
      - run: npm run build
