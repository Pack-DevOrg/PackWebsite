name: Deploy website

# Trunk deploy of app.trypackai.com (scripts/deploy-app-origin.mjs) on every master push.
# Replaces the laptop `npm run deploy` (ledger A183). Role pack-gha-deploy-website (PackServer
# stacks/ops) trusts only this repo's master. A running deploy is never cancelled; only the newest
# waiting push runs next.
#
# City-image manifests are an S3 read on the app-origin bucket
# (generated/city-image-cache/*.json). Tiles stay at the baseImageUrl prefix.
# No PackServer checkout. pack-ci-read is not used here.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The post-deploy live verify drives a real browser against the published routes.
      - run: npx playwright install --with-deps chromium
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WEBSITE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy app origin
        run: npm run deploy

  # Real browser path after the site is live. The same workflow runs when the
  # API stack deploy sends repository_dispatch type api-stack-deployed.
  signin-smoke:
    needs: deploy
    uses: ./.github/workflows/web-signin-smoke.yml
    secrets: inherit
