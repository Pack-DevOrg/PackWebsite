<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pack</title>
<meta name="robots" content="noindex" />
<meta name="apple-itunes-app" content="app-id=6761626050, app-clip-bundle-id=com.packai.app.Clip, app-clip-display=card" />
<meta name="color-scheme" content="light dark" />
<style>
:root { --bg: #f6f4f1; --card: #fff; --ink: #201f1e; --muted: #6b6a68; --line: #e4e1dd; --accent: #e72340; --saffron: #f0c62d; }
@media (prefers-color-scheme: dark) { :root { --bg: #151413; --card: #201f1e; --ink: #f4f2ef; --muted: #a8a5a1; --line: #353535; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
#card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px; min-height: 120px; }
.kind { margin: 0 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.title { margin: 0 0 16px; font-size: 26px; line-height: 1.2; }
.section { margin: 0 0 14px; }
.sectionTitle { margin: 18px 0 6px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.label { color: var(--muted); }
.value { font-weight: 600; text-align: right; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; }
.step { padding: 12px 0; border-top: 1px solid var(--line); }
.step.done .stepText { text-decoration: line-through; opacity: .5; }
.stepLabel { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.stepLabel input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.progress { margin: 0; color: var(--muted); font-size: 14px; }
.action { display: inline-block; margin: 10px 0 0 34px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
.places { list-style: none; margin: 0; padding: 0; }
.place { display: flex; flex-direction: column; padding: 10px 0; border-top: 1px solid var(--line); }
.placeDetail { color: var(--muted); font-size: 14px; }
.placeHead { display: flex; align-items: center; gap: 12px; }
.placeBody { display: flex; flex-direction: column; flex: 1; }
.placeName { font-weight: 700; color: inherit; text-decoration: none; }
.placeWhy { font-size: 14px; }
.rank { flex: none; width: 28px; height: 28px; border-radius: 14px; background: var(--saffron); color: #1e1e1e; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.placePhoto { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; }
.map { width: 100%; height: auto; margin-top: 14px; background: rgba(127,127,127,.14); border-radius: 12px; }
.source { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
.source a { color: inherit; }
.cta { display: block; margin-top: 18px; padding: 14px; border-radius: 14px; background: var(--ink); color: var(--bg); text-align: center; font-weight: 600; text-decoration: none; }
#card.dense { padding: 14px; border-radius: 16px; }
.placesCard .title { margin: 0 0 8px; font-size: 18px; }
.teamHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 72px; padding: 0 14px; border-radius: 16px; background: var(--line); color: #fff; }
.teamText { flex: 1; min-width: 0; }
.teamName { margin: 0; font-size: 18px; line-height: 1.2; white-space: nowrap; }
.teamName.two { white-space: normal; line-height: 1.15; }
.teamRecord { margin: 2px 0 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.teamLogo { width: 56px; height: 56px; object-fit: contain; flex: none; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tile { flex: 1 1 31%; height: 56px; border-radius: 8px; background: rgba(127,127,127,.14); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tileValue { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tileLabel { font-size: 11px; color: var(--muted); }
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; margin-top: 12px; }
.playerCol { min-width: 0; }
.colHead { margin: 0; height: 22px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.player { height: 40px; display: flex; flex-direction: column; justify-content: center; border-top: 1px solid var(--line); overflow: hidden; }
.playerName { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.playerLine { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#card.dense .source { margin-top: 12px; font-size: 10px; height: 14px; overflow: hidden; white-space: nowrap; }
.placesCard .map { display: block; width: 100%; height: 40vh; max-height: 276px; margin: 0 0 12px; }
.placesCard .title { margin: 0 0 8px; font-size: 18px; }
.placeFrame { position: relative; height: 560px; border-radius: 16px; overflow: hidden; background: #1a1918; border: 1px solid var(--line); }
.mapArea { position: absolute; top: 0; left: 0; right: 0; aspect-ratio: 358 / 300; }
.mapArea .mapImage, .mapArea svg.map { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; margin: 0; border-radius: 0; }
.pin { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: var(--saffron); color: #1e1e1e; font-weight: 700; overflow: hidden; cursor: pointer; z-index: 1; }
.pin.on { width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 3px solid var(--saffron); z-index: 2; }
.pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rail { position: absolute; left: 0; right: 0; bottom: 12px; height: 236px; display: flex; gap: 8px; padding: 0 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; z-index: 5; }
.rail::-webkit-scrollbar { display: none; }
.placeCard { flex: 0 0 calc(100% - 0px); scroll-snap-align: start; display: flex; flex-direction: column; height: 236px; border-radius: 16px; background: #121212; color: #f4f2ef; border: 1px solid rgba(255,255,255,.2); overflow: hidden; text-decoration: none; }
.placePhotoWrap { position: relative; height: 118px; flex: none; background: #2c2c2c; margin-bottom: 8px; }
.placePhotoWrap > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.placePhotoWrap .rank { position: absolute; top: 8px; left: 8px; width: auto; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; font-size: 13px; }
.ratingBadge { position: absolute; top: 8px; right: 8px; height: 26px; line-height: 26px; padding: 0 8px; border-radius: 13px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; font-weight: 600; }
.dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
.dots i.on { background: #fff; }
.placeCard .placeName { padding: 0 12px; font-size: 18px; line-height: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.placeCard .placeMeta { padding: 0 12px; font-size: 13px; line-height: 18px; color: #a8a5a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.placeMeta b.open { color: #4caf50; } .placeMeta b.closed { color: #ff9800; }
.chip { align-self: flex-start; margin: 4px 12px 0; height: 26px; line-height: 26px; padding: 0 10px; border-radius: 13px; background: var(--saffron); color: #1e1e1e; font-size: 13px; font-weight: 600; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
noscript { display: block; padding: 16px 0; }
</style>
</head>
<body>
<main>
<div id="card" aria-live="polite">Loading...</div>
<a class="cta" href="https://apps.apple.com/app/id6761626050">Get the App Clip / Open in Pack</a>
<noscript>This card needs JavaScript. <a href="https://apps.apple.com/app/id6761626050">Open Pack</a></noscript>
</main>
<script src="/a-card.v2.js"></script>
</body>
</html>
