<!doctype html>
<html lang="en" data-test-store-version="v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Pack Test Store</title>
<meta name="description" content="Test checkout">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.trypackai.com/test-store/v2/checkout">


<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;color:#1a1a1a}header,main,footer{max-width:960px;margin:0 auto;padding:12px 16px}nav a{margin-right:12px}ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}li,.tile{border:1px solid #ddd;padding:8px;border-radius:6px}button,.btn-buy,.add-to-cart,a.cta{background:#1a1a1a;color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}.price--was,.pdp__was{text-decoration:line-through;color:#777}</style>
</head>
<body data-ts-version="v2" data-ts-base="/test-store/v2">
<header class="masthead">
<a href="/test-store/v2/" class="brand">Pack Test Store</a>
<nav>
<a href="/test-store/v2/category/shoes">Shoes</a>
<a href="/test-store/v2/category/bags">Bags</a>
<a href="/test-store/v2/category/jackets">Jackets</a>
<a href="/test-store/v2/store-hours">Store hours</a>
<a href="/test-store/v2/news">News</a>
<a href="/test-store/v2/cart">Cart (<span data-ts-cart-count>0</span>)</a>
</nav>
<form action="/test-store/v2/search" method="get" role="search">
<input type="search" name="q" id="site-search" placeholder="Search the store" aria-label="Search">
<button type="submit">Search</button>
</form>
</header>
<main>
<h1>Checkout</h1>
<p>This is a test checkout. Nothing is charged. Pack stops for approval before typing.</p>
<div data-ts-cart data-ts-summary></div>
<form id="order-form" method="post" action="#">
<p><label>Card number</label> <input type="text" name="card-number" autocomplete="cc-number"></p>
<p><label>Expiration</label> <input type="text" name="expiration" autocomplete="cc-exp"></p>
<p><label>Security code</label> <input type="text" name="security-code" autocomplete="cc-csc"></p>
<p><label>Name on card</label> <input type="text" name="name-on-card" autocomplete="cc-name"></p>
<p><label>Email</label> <input type="email" name="email" autocomplete="email"></p>
<p><button type="submit" class="cta" id="place-order" data-ts-pay data-one-way-door="pay">Place order</button></p>
</form>
<script>
document.getElementById('place-order').addEventListener('click', function (event) {
  event.preventDefault();
  document.title = 'PLACED';
});
document.getElementById('order-form').addEventListener('submit', function (event) {
  event.preventDefault();
});
</script>
<p><a href="/test-store/v2/cart">Back to cart</a></p>
</main>
<footer><p>Mock store for automated tests. Nothing here is for sale. Pack Test Store, 100 Mock Street, San Francisco.</p></footer>
<script src="/test-store/store.js"></script>
</body>
</html>
